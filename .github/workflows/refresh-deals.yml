name: Refresh and Publish Knoxville Deals
on:
  push:
    branches: [main]
  schedule:
    # 8:17 AM EST / 9:17 AM EDT (GitHub cron runs in UTC and may be delayed)
    - cron: '17 13 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: knoxville-daily-site
  cancel-in-progress: false

jobs:
  refresh-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate the deal collector
        run: python -m unittest discover -s tests -v
      - name: Collect new public deal posts
        run: python scripts/update_deals.py
      - name: Commit daily snapshot and history
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/latest.json data/history.json
          if ! git diff --staged --quiet; then
            git commit -m "Refresh coupon discovery $(date -u +%Y-%m-%d)"
            # Include any commits that landed after this run checked out.
            # If the remote changes on the first try, retry a rebased push.
            for attempt in 1 2 3; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                echo "Could not push the daily snapshot after 3 attempts" >&2
                exit 1
              fi
              sleep 2
            done
          fi
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload website and current data
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4